<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mochi — Internship Diary</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Nunito = same rounded font as the login page. Kalam = a handwritten font,
     used only for the date/notes so the diary feels journaled, not typed. -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================
   Same color-variable system as the Mochi login page, so this
   page can drop straight into the same site and feel identical.
   Two new variables added at the bottom of each block just for
   the diary (ribbon/tape/paper colors).
   ========================================================== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-page:        #f3dfa7;
    --bg-input:       #FFFFFF;
    --border-input:   #4A8C72;
    --text-primary:   #2C2418;
    --text-secondary: #7A6A56;
    --text-label:     #3A6B52;
    --accent-coral:   #c0694c;
    --btn-bg:         #3A6B52;
    --btn-text:       #FFFFFF;
    --toggle-track:   #d3c090;
    --toggle-thumb:   #3A6B52;
    --header-bg:      #ecd096;
    --input-shadow:   rgba(74,140,114,0.15);
    /* diary-only additions */
    --ribbon:         #3A6B52;   /* filmstrip track color */
    --ribbon-hole:     #f3dfa7;  /* sprocket holes = page color, so they look "cut out" */
    --paper:          #FFFDF7;   /* polaroid / note paper */
    --tape:           #E8A838;   /* washi-tape gold accent */
    --paper-shadow:   rgba(44,36,24,0.18);
  }

  [data-theme="dark"] {
    --bg-page:        #36312a;
    --bg-input:       #2A2318;
    --border-input:   #5DCAA5;
    --text-primary:   #F0E8D5;
    --text-secondary: #A89880;
    --text-label:     #5DCAA5;
    --accent-coral:   #F0997B;
    --btn-bg:         #5DCAA5;
    --btn-text:       #1C1812;
    --toggle-track:   #4c4436;
    --toggle-thumb:   #5DCAA5;
    --header-bg:      #24221e;
    --input-shadow:   rgba(93,202,165,0.1);
    --ribbon:         #5DCAA5;
    --ribbon-hole:    #36312a;
    --paper:          #2A2318;
    --tape:           #FAC775;
    --paper-shadow:   rgba(0,0,0,0.4);
  }

  body {
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: 'Nunito', sans-serif;
    font-weight: 600;
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
    cursor: none; /* hide the native arrow — our own cursor image replaces it */
  }
  a, button, input { cursor: none; } /* form elements default back to pointer/text otherwise */

  /* ---- CUSTOM CURSOR ----
     A little rodent that follows the mouse everywhere. Positioned with
     left/top + a translate offset so its center sits on the real pointer. */
  #cursorMouse {
    position: fixed; top: 0; left: 0;
    width: 46px; height: 46px;
    pointer-events: none; /* never blocks clicks on what's underneath */
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.05s linear;
  }

  /* ---- HEADER (identical to login page, minus the tabs) ---- */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--header-bg);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; height: 60px;
    transition: background 0.9s;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .demo-badge {
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px;
    letter-spacing: 2.5px; color: var(--text-label);
    background: var(--toggle-track); padding: 6px 16px; border-radius: 20px;
    transition: background 0.3s, color 0.3s;
  }
  .header-right { display: flex; align-items: center; gap: 16px; }

  .theme-toggle {
    display: flex; align-items: center;
    background: var(--toggle-track);
    border-radius: 20px; padding: 3px; cursor: pointer; gap: 2px;
    transition: background 0.3s; border: none; outline: none;
  }
  .theme-toggle .icon {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.3s;
  }
  .theme-toggle .icon img { width: 24px; height: 24px; object-fit: contain; }
  .theme-toggle .icon.active { background: var(--toggle-thumb); }

  /* ---- MAIN ---- */
  main { min-height: 100vh; padding: 96px 24px 48px; display: flex; justify-content: center; }
  .diary-wrap { width: 100%; max-width: 880px; }

  /* ---- HEAD: mochi badge + big handwritten date ---- */
  .diary-head { display: flex; align-items: center; gap: 18px; margin-bottom: 26px; }

  .mochi-badge { position: relative; width: 74px; height: 86px; flex: 0 0 auto; }
  .mochi-badge img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
  #badgeBase { z-index: 1; }
  #badgeEyes { z-index: 2; }
  #badgeExpr { z-index: 3; opacity: 0; }
  #badgeExpr.visible { opacity: 1; }

  .diary-heading { flex: 1; }
  .diary-title {
    font-family: 'Kalam', cursive; font-weight: 700;
    font-size: 40px; line-height: 1; color: var(--text-primary);
    transition: color 0.3s;
  }
  .diary-sub { font-size: 14px; color: var(--text-secondary); margin-top: 6px; }
  .diary-sub b { color: var(--text-label); }

  /* ---- FILMSTRIP TIMELINE ----
     A ribbon styled like a strip of camera film: sprocket holes along
     the top/bottom, a big pin-shaped thumb you drag to jump between days. */
  .filmstrip-wrap { margin-bottom: 22px; }

  input[type="range"].date-slider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 34px; background: transparent; cursor: pointer;
    outline: none;
  }
  /* the track: solid ribbon color + two rows of small "sprocket hole" dots
     built purely from a repeating radial-gradient, no images needed */
  input[type="range"].date-slider::-webkit-slider-runnable-track {
    height: 34px; border-radius: 8px;
    background:
      radial-gradient(circle 4px, var(--ribbon-hole) 98%, transparent 100%) repeat-x left 6px / 22px 100%,
      radial-gradient(circle 4px, var(--ribbon-hole) 98%, transparent 100%) repeat-x left 6px / 22px 100%,
      var(--ribbon);
    background-position: 6px 6px, 6px 28px, 0 0;
    background-size: 22px 8px, 22px 8px, 100% 100%;
    background-repeat: repeat-x, repeat-x, no-repeat;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.25);
    transition: background-color 0.3s;
  }
  input[type="range"].date-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 26px; height: 26px; margin-top: 4px;
    border-radius: 50%;
    background: var(--tape);
    border: 3px solid var(--paper);
    box-shadow: 0 2px 6px var(--paper-shadow);
    cursor: grab;
  }
  input[type="range"].date-slider::-moz-range-track {
    height: 34px; border-radius: 8px; background: var(--ribbon);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.25);
  }
  input[type="range"].date-slider::-moz-range-thumb {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--tape); border: 3px solid var(--paper);
    box-shadow: 0 2px 6px var(--paper-shadow); cursor: grab;
  }

  /* quick-jump week labels under the ribbon */
  .week-ticks { display: flex; justify-content: space-between; margin-top: 8px; padding: 0 2px; }
  .week-tick {
    background: none; border: none; cursor: pointer;
    font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 700;
    color: var(--text-secondary); letter-spacing: 0.3px;
    padding: 3px 4px; border-radius: 6px; transition: color 0.2s, background 0.2s;
  }
  .week-tick:hover, .week-tick:focus-visible { color: var(--text-label); background: var(--input-shadow); }
  .week-tick.on-month-start { color: var(--text-label); }

  /* ---- ENTRY CARD: polaroid carousel + note ---- */
  .entry-card {
    display: flex; gap: 26px; align-items: flex-start;
    background: var(--bg-input); border-radius: 22px;
    padding: 24px; box-shadow: 0 6px 20px var(--input-shadow);
    transition: background 0.3s;
  }

  /* -- polaroid photo -- */
  .polaroid-col { flex: 0 0 auto; width: 240px; }
  .polaroid {
    background: var(--paper); padding: 12px 12px 34px; border-radius: 4px;
    box-shadow: 0 8px 18px var(--paper-shadow);
    transform: rotate(-2deg); transition: transform 0.2s, background 0.3s;
  }
  .polaroid:hover { transform: rotate(0deg); }
  .photo-frame { position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; border-radius: 2px; background: #ddd; }
  .photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---- BIG MOCHI (used for weeks with no dev screenshots) ----
     Same 3-layer trick as the header badge, just filling the whole
     polaroid frame instead of a small corner icon. */
  .big-mochi { position: absolute; inset: 0; display: none; background: var(--bg-page); }
  .big-mochi img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
  #bigBase { z-index: 1; }
  #bigEyes { z-index: 2; }
  #bigExpr { z-index: 3; opacity: 0; }
  #bigExpr.visible { opacity: 1; }
  .polaroid-caption {
    font-family: 'Kalam', cursive; font-size: 15px; text-align: center;
    color: var(--text-primary); margin-top: 10px;
  }

  .carousel-controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; }
  .carousel-controls button {
    width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--toggle-track); color: var(--text-label); font-size: 16px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; transition: background 0.2s;
  }
  .carousel-controls button:hover { background: var(--btn-bg); color: var(--btn-text); }
  .dots { display: flex; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--toggle-track); transition: background 0.2s, transform 0.2s; }
  .dot.active { background: var(--text-label); transform: scale(1.3); }

  /* -- note column -- */
  .note-col { flex: 1; min-width: 0; }
  .note-label {
    display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-label); margin-bottom: 6px;
  }
  .note-text {
    font-family: 'Kalam', cursive; font-size: 19px; line-height: 1.5;
    color: var(--text-primary); margin-bottom: 18px;
  }
  .note-text code {
    font-family: 'Nunito', sans-serif; font-size: 0.75em; font-weight: 700;
    background: var(--input-shadow); color: var(--text-label);
    padding: 1px 6px; border-radius: 6px;
  }
  .mood-tag {
    display: inline-block; padding: 6px 14px; border-radius: 20px;
    background: var(--input-shadow); color: var(--text-label);
    font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700;
  }
  .links-wrap { display: none; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .entry-link {
    text-decoration: none; font-family: 'Nunito', sans-serif;
    font-size: 13px; font-weight: 700; color: var(--btn-text);
    background: var(--btn-bg); padding: 7px 14px; border-radius: 16px;
    transition: opacity 0.2s;
  }
  .entry-link:hover { opacity: 0.85; }

  @media (max-width: 620px) {
    .entry-card { flex-direction: column; align-items: center; }
    .polaroid-col { width: 220px; }
    .diary-title { font-size: 32px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<img id="cursorMouse" src="cursor-hamster.png" alt="">

<header>
  <div class="header-left">
    <div class="demo-badge">DEMO</div>
  </div>
  <div class="header-right">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <span class="icon active" id="sunIcon"><img src="SunToggle.png" alt="Light"></span>
      <span class="icon" id="moonIcon"><img src="MoonToggle.png" alt="Dark"></span>
    </button>
  </div>
</header>

<main>
  <div class="diary-wrap">

    <!-- Mochi badge + current date -->
    <div class="diary-head">
      <div class="mochi-badge" id="mochiBadge">
        <img id="badgeBase" src="original.png" alt="">
        <img id="badgeEyes" src="eyes.png" alt="">
        <img id="badgeExpr" src="" alt="">
      </div>
      <div class="diary-heading">
        <div class="diary-title" id="dateTitle">June 1</div>
        <div class="diary-sub">Day <b id="dayNum">1</b> of <b>61</b> · Internship progress diary</div>
      </div>
    </div>

    <!-- Filmstrip timeline: drag the pin, or tap a week label to jump -->
    <div class="filmstrip-wrap">
      <input type="range" class="date-slider" id="dateSlider" min="0" max="60" step="1" value="0"
             aria-label="Select a diary date between June 1 and July 31">
      <div class="week-ticks" id="weekTicks"></div>
    </div>

    <!-- Entry: rotating polaroid carousel + handwritten note -->
    <div class="entry-card">
      <div class="polaroid-col">
        <div class="polaroid">
          <div class="photo-frame" id="photoFrame">
            <img id="photoImg" src="" alt="Diary photo">
            <div class="big-mochi" id="bigMochi">
              <img id="bigBase" src="original.png" alt="">
              <img id="bigEyes" src="eyes.png" alt="">
              <img id="bigExpr" src="" alt="">
            </div>
          </div>
          <div class="polaroid-caption" id="photoCaption">Day 1 · Photo 1</div>
        </div>
        <div class="carousel-controls" id="carouselCtrl">
          <button id="prevPhoto" aria-label="Previous photo">‹</button>
          <div class="dots" id="photoDots"></div>
          <button id="nextPhoto" aria-label="Next photo">›</button>
        </div>
      </div>
      <div class="note-col">
        <span class="note-label">What I worked on</span>
        <p class="note-text" id="noteText"></p>
        <span class="note-label">Mood</span>
        <div class="mood-tag" id="moodTag"></div>
        <div class="links-wrap" id="linksWrap"></div>
      </div>
    </div>

  </div>
</main>

<script>
/* ==========================================================
   HOW TO PLUG IN YOUR REAL INTERNSHIP DATA LATER
   --------------------------------------------------
   Everything below is generated automatically as PLACEHOLDER
   content so the page works right now. Once you know exactly
   what you want to show, just replace the body of buildDay()
   near the bottom with your real notes/photos, e.g.:

     if (dayNum === 5) return {
       note: "Set up the dev environment and read the codebase.",
       mood: 'default',
       photos: ["photos/day5-1.jpg", "photos/day5-2.jpg"]
     };

   Anything you don't override keeps using the auto-generated
   placeholder, so you can fill in real days gradually.
   ========================================================== */

// ---- DATE RANGE ----
const START = new Date(2026, 5, 1);   // June 1  (month index 5 = June)
const END   = new Date(2026, 6, 31);  // July 31
const TOTAL_DAYS = Math.round((END - START) / 86400000) + 1; // = 61

const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function dateAt(i) {
  const d = new Date(START);
  d.setDate(d.getDate() + i);
  return d;
}
function formatLong(d) { return `${MONTH_NAMES[d.getMonth()]==='Jun'?'June':'July'} ${d.getDate()}`; }
function formatShort(d) { return `${MONTH_NAMES[d.getMonth()]} ${d.getDate()}`; }

// ---- PLACEHOLDER PHOTO GENERATOR ----
// Builds a simple SVG "photo" on the fly (no external image files needed
// yet) so the carousel has something to show. Swap these src strings for
// real file paths once you have your pictures.
function placeholderPhoto(dayNum, photoIndex) {
  const hue = (dayNum * 11 + photoIndex * 40) % 360;
  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="hsl(${hue},55%,72%)"/>
          <stop offset="100%" stop-color="hsl(${(hue+50)%360},55%,55%)"/>
        </linearGradient>
      </defs>
      <rect width="400" height="400" fill="url(#g)"/>
      <circle cx="200" cy="160" r="70" fill="rgba(255,255,255,0.25)"/>
      <text x="200" y="330" font-family="Nunito, sans-serif" font-size="26" font-weight="700"
            fill="rgba(255,255,255,0.9)" text-anchor="middle">Day ${dayNum} · Photo ${photoIndex + 1}</text>
    </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

// ---- MOOD BY DATE ----
// Placeholder rule: first/last day = excited, weekends = sleepy (no work),
// everything else = a normal focused day. Replace with real moods later.
function moodFor(d, dayNum) {
  if (dayNum === 1 || dayNum === TOTAL_DAYS) return 'surprised';
  const dow = d.getDay(); // 0 = Sunday, 6 = Saturday
  if (dow === 0 || dow === 6) return 'sleepy';
  return 'default';
}
const MOOD_LABEL = {
  default:   '🙂 Focused',
  sleepy:    '💤 Slow day / weekend',
  surprised: '🎉 Milestone!'
};
// Maps mood -> expression image, same filenames as the login page's mochi
const MOOD_IMG = {
  default:   '',            // no overlay needed, base face is enough
  sleepy:    'sleepy.png',
  surprised: 'surprised.png'
};

const PLACEHOLDER_NOTES = [
  "Placeholder note — describe what you learned or built on this day.",
  "Placeholder note — jot down a task, a bug fixed, or a meeting takeaway.",
  "Placeholder note — add a quick reflection or a small win from today.",
];

// ---- WEEKEND PHOTO POOL ----
// Real (non-work) photos + jokey captions, cycled through every Saturday/
// Sunday in the diary. Add more objects here any time — they'll just join
// the rotation. Photos live in the same folder as diary.html.
const WEEKEND_ENTRIES = [
  {
    photo: 'weekend-tennis.png',
    caption: 'Tennis > try/catch',
    note: "Played tennis today — because being bad at one thing (coding) clearly wasn't enough for one weekend."
  },
  {
    photo: 'weekend-flight.png',
    caption: 'Caught a flight to sanity',
    note: "Caught a flight to sanity after yesterday's error message. 10/10 view, would crash again."
  }
];
let weekendCounter = 0; // cycles through WEEKEND_ENTRIES in order as weekends come up

// A simple "document" card used whenever a day has notes/links but no
// photos yet, so the polaroid slot never looks broken or empty.
function docPlaceholderSVG(caption) {
  const svg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
      <rect width="400" height="400" fill="#e7dcc0"/>
      <rect x="90" y="60" width="220" height="280" rx="10" fill="#fffdf7" stroke="#c9b98a" stroke-width="3"/>
      <line x1="120" y1="120" x2="280" y2="120" stroke="#c9b98a" stroke-width="6"/>
      <line x1="120" y1="160" x2="280" y2="160" stroke="#c9b98a" stroke-width="6"/>
      <line x1="120" y1="200" x2="240" y2="200" stroke="#c9b98a" stroke-width="6"/>
      <text x="200" y="365" font-family="Nunito, sans-serif" font-size="20" font-weight="700"
            fill="#7a6a56" text-anchor="middle">${caption}</text>
    </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

// ---- BUILD ALL 61 DAYS ----
function buildDay(i) {
  const d = dateAt(i);
  const dayNum = i + 1;

  // ---- REAL PROGRESS, in place of placeholders, as it comes in ----
  if (dayNum === 1) {
    return {
      date: d, label: formatLong(d), dayNum, mood: 'default',
      note: "Research day — looked into existing food-sorting and match-3 style mobile games: core mechanics, level pacing, and monetization patterns, before starting the design doc.",
      links: [{ label: '📄 Research notes', url: 'https://docs.google.com/document/d/1RhMnqDutOYF4iP57AK9ZbfcG7g7M5YX7WwIKoidhSqk/edit?usp=sharing' }],
      photos: [], photoCaptions: []
    };
  }
  if (dayNum === 2) {
    return {
      date: d, label: formatLong(d), dayNum, mood: 'default',
      note: "Turned yesterday's research into a full Game Design Document — core loop, food categories per episode, level progression tables, monetization plan, and the 4-week dev roadmap.",
      links: [{ label: '📄 Game Design Document', url: 'https://docs.google.com/document/d/1bFlVpa68chdKFJUJwH9425kW1z-rvMaAWVya1qfArrg/edit?usp=sharing' }],
      photos: [], photoCaptions: []
    };
  }
  if (dayNum === 3) {
    return {
      date: d, label: formatLong(d), dayNum, mood: 'default',
      noteHTML:
        "<b>Setup</b> — Unity 6.3 LTS installed with Android build support, VS Code connected as the script editor, " +
        "project folders organized (Scripts, Prefabs, Sprites, Audio, Levels, Fonts), GitHub repo created and pushed." +
        "<br><br><b>Core architecture</b> — <code>LevelData.cs</code> data model matching the GDD's JSON schema, " +
        "<code>level_01.json</code> as the first data-driven level, <code>GameBoard.cs</code> loading JSON into a grid, " +
        "<code>FoodSlot.cs</code> handling drag-and-swap (almost working)." +
        "<br><br>✅ JSON loader &nbsp; ✅ Grid renders &nbsp; ✅ Food colors display correctly" +
        "<br>🛠️ One thing left for tomorrow: switch Active Input Handling to \"Both\" in Project Settings — a one-dropdown fix.",
      photos: ['day3-unity-error.png', 'day3-github-repo.png'],
      photoCaptions: ['Blocked here — Input System setting, fixed in one dropdown', 'GitHub repo set up and pushed']
    };
  }

  if (dayNum >= 43 && dayNum <= 48) { // July 13 - July 18
    return {
      date: d, label: formatLong(d), dayNum, mood: 'default',
      noteHTML:
        "This stretch (July 13–18) went into the diary tool itself — reworking its UI/UX and rewriting how each " +
        "day's record actually gets written, so entries stay clear and clean instead of cluttered." +
        "<br><br>No new dev screenshots this week, so here's Mochi instead, fully alive: blinking, dozing off " +
        "after a few idle seconds, and getting spooked if that hamster wanders too close.",
      photos: [], photoCaptions: [],
      showBigMochi: true,
      bigCaption: "Mochi, at full size — same blinking and hamster-shy reactions as the badge up top"
    };
  }

  // ---- PLACEHOLDER (every other day, until real progress replaces it) ----
  const mood = moodFor(d, dayNum);

  if (mood === 'sleepy') {
    // Weekend — pull the next entry from the fun-photo pool instead of the
    // generic work-day placeholder.
    const entry = WEEKEND_ENTRIES[weekendCounter % WEEKEND_ENTRIES.length];
    weekendCounter++;
    return {
      date: d, label: formatLong(d), dayNum, mood,
      note: entry.note,
      photos: [entry.photo],
      photoCaptions: [entry.caption]
    };
  }

  return {
    date: d,
    label: formatLong(d),
    dayNum,
    mood,
    note: PLACEHOLDER_NOTES[i % PLACEHOLDER_NOTES.length],
    photos: [
      placeholderPhoto(dayNum, 0),
      placeholderPhoto(dayNum, 1),
      placeholderPhoto(dayNum, 2)
    ]
  };
}
const diaryData = Array.from({ length: TOTAL_DAYS }, (_, i) => buildDay(i));

// ---- GRAB ELEMENTS ----
const dateSlider   = document.getElementById('dateSlider');
const weekTicks    = document.getElementById('weekTicks');
const dateTitle    = document.getElementById('dateTitle');
const dayNumEl     = document.getElementById('dayNum');
const noteText     = document.getElementById('noteText');
const moodTag      = document.getElementById('moodTag');
const linksWrap    = document.getElementById('linksWrap');
const photoImg     = document.getElementById('photoImg');
const photoCaption = document.getElementById('photoCaption');
const photoDots    = document.getElementById('photoDots');
const carouselCtrl = document.getElementById('carouselCtrl');
const badgeEyes    = document.getElementById('badgeEyes');
const badgeExpr    = document.getElementById('badgeExpr');
const bigMochi     = document.getElementById('bigMochi');
const bigEyes      = document.getElementById('bigEyes');
const bigExpr      = document.getElementById('bigExpr');

dateSlider.max = TOTAL_DAYS - 1;

// ---- WEEK QUICK-JUMP LABELS (every 7th day) ----
for (let i = 0; i < TOTAL_DAYS; i += 7) {
  const btn = document.createElement('button');
  btn.className = 'week-tick';
  btn.textContent = formatShort(diaryData[i].date);
  btn.addEventListener('click', () => {
    dateSlider.value = i;
    selectDate(i, /*immediateCarousel*/ true);
  });
  weekTicks.appendChild(btn);
}

// ---- CAROUSEL STATE ----
let currentDay = 0;
let currentPhoto = 0;
let currentPhotos = [];
let currentCaptions = [];
let carouselTimer = null;

function stopCarousel() { clearInterval(carouselTimer); carouselTimer = null; }
function startCarousel() {
  stopCarousel();
  if (currentPhotos.length > 1) {
    carouselTimer = setInterval(() => showPhoto(currentPhoto + 1), 3200);
  }
}

function renderDots() {
  photoDots.innerHTML = '';
  currentPhotos.forEach((_, idx) => {
    const dot = document.createElement('span');
    dot.className = 'dot' + (idx === currentPhoto ? ' active' : '');
    photoDots.appendChild(dot);
  });
}

function showPhoto(index) {
  currentPhoto = (index + currentPhotos.length) % currentPhotos.length;
  photoImg.src = currentPhotos[currentPhoto];
  photoCaption.textContent = currentCaptions[currentPhoto]
    || `Day ${diaryData[currentDay].dayNum} · Photo ${currentPhoto + 1}`;
  renderDots();
}

// Renders the link pills (Google Doc links etc.) under the note, if any.
function renderLinks(links) {
  linksWrap.innerHTML = '';
  if (!links || !links.length) { linksWrap.style.display = 'none'; return; }
  linksWrap.style.display = 'flex';
  links.forEach(l => {
    const a = document.createElement('a');
    a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.className = 'entry-link'; a.textContent = l.label;
    linksWrap.appendChild(a);
  });
}

// ---- MOCHI FACE CONTROLLER (blink + idle-sleepy + distress) ----
// Ported from the login page's mochi. Eye-tracking was left out on purpose
// (there's no cursor-following context here), but blinking, the 10s
// idle-sleepy timeout, and a new "distress" reaction all work the same way.
// This is a factory so the exact same behavior can drive both the small
// header badge and the big full-size Mochi used on UI-polish weeks —
// each gets its own independent timers and mood state.
function pause(ms) { return new Promise(r => setTimeout(r, ms)); }

function createMochiController(eyesEl, exprEl) {
  let mood = 'default';       // 'default' | 'sleepy' | 'surprised' — comes from the selected date
  let idleSleepy = false;     // dozed off from inactivity, even on an otherwise normal day
  let distressed = false;     // cursor-hamster got too close — highest-priority reaction
  let blinkTimer = null;
  let idleTimer = null;

  function render() {
    if (distressed) {
      // Cursor got close — spooked, overrides everything else, no blinking.
      clearTimeout(blinkTimer);
      eyesEl.style.display = 'none';
      exprEl.src = 'mad.png';
      exprEl.classList.add('visible');
    } else if (mood !== 'default') {
      // Persistent day-mood expression (weekend / milestone) — no blinking.
      clearTimeout(blinkTimer);
      eyesEl.style.display = 'none';
      const src = MOOD_IMG[mood];
      if (src) { exprEl.src = src; exprEl.classList.add('visible'); }
    } else if (idleSleepy) {
      // Dozed off from inactivity, even though today is a normal work day.
      clearTimeout(blinkTimer);
      eyesEl.style.display = 'none';
      exprEl.src = 'sleepy.png';
      exprEl.classList.add('visible');
    } else {
      // Normal awake state — show open eyes and start blinking.
      eyesEl.style.display = '';
      exprEl.classList.remove('visible');
      scheduleBlink();
    }
  }

  function scheduleBlink() {
    clearTimeout(blinkTimer);
    blinkTimer = setTimeout(doBlink, 3000 + Math.random() * 3000);
  }
  async function doBlink() {
    if (mood !== 'default' || idleSleepy || distressed) return; // conditions changed, stop blinking
    await flashBlink();
    if (Math.random() < 0.25) { await pause(60); await flashBlink(); } // occasional double-blink
    if (mood === 'default' && !idleSleepy && !distressed) scheduleBlink();
  }
  function flashBlink() {
    return new Promise(res => {
      eyesEl.style.display = 'none';
      exprEl.src = 'blink.png';
      exprEl.classList.add('visible');
      setTimeout(() => {
        exprEl.classList.remove('visible');
        if (mood === 'default' && !idleSleepy && !distressed) eyesEl.style.display = '';
        res();
      }, 140);
    });
  }

  function startIdleTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (mood === 'default' && !distressed) { idleSleepy = true; render(); }
    }, 10000); // 10 seconds
  }

  return {
    // Call when the selected date changes — sets the day's mood and wakes it up.
    setMood(m) { mood = m; idleSleepy = false; distressed = false; render(); startIdleTimer(); },
    // Call on any mouse/keyboard activity to cancel idle-sleepy and restart the countdown.
    noteActivity() { if (idleSleepy) { idleSleepy = false; render(); } startIdleTimer(); },
    // Call with true/false as the cursor enters/leaves the distress radius.
    setDistressed(v) { if (v === distressed) return; distressed = v; render(); }
  };
}

const badgeCtl = createMochiController(badgeEyes, badgeExpr);
const bigCtl   = createMochiController(bigEyes, bigExpr);

document.addEventListener('mousemove', () => { badgeCtl.noteActivity(); bigCtl.noteActivity(); });
document.addEventListener('keydown',   () => { badgeCtl.noteActivity(); bigCtl.noteActivity(); });

// ---- CUSTOM CURSOR + PROXIMITY DISTRESS ----
// The cursor image follows the mouse everywhere. If it gets close to a
// Mochi (the header badge, or the big one on UI-polish weeks), that Mochi
// gets spooked — checked independently for each, since only one may be
// visible at a time.
const cursorMouse = document.getElementById('cursorMouse');
const mochiBadge   = document.getElementById('mochiBadge');
const DISTRESS_RADIUS_BADGE = 130; // px
const DISTRESS_RADIUS_BIG   = 220; // px — bigger Mochi, bigger personal space

document.addEventListener('mousemove', (e) => {
  // move the cursor image
  cursorMouse.style.left = e.clientX + 'px';
  cursorMouse.style.top  = e.clientY + 'px';

  // header badge
  const badgeRect = mochiBadge.getBoundingClientRect();
  const bdx = e.clientX - (badgeRect.left + badgeRect.width / 2);
  const bdy = e.clientY - (badgeRect.top + badgeRect.height / 2);
  badgeCtl.setDistressed(Math.hypot(bdx, bdy) < DISTRESS_RADIUS_BADGE);

  // big Mochi — only meaningful while it's actually visible
  if (bigMochi.style.display !== 'none') {
    const bigRect = bigMochi.getBoundingClientRect();
    const gdx = e.clientX - (bigRect.left + bigRect.width / 2);
    const gdy = e.clientY - (bigRect.top + bigRect.height / 2);
    bigCtl.setDistressed(Math.hypot(gdx, gdy) < DISTRESS_RADIUS_BIG);
  }
});

// ---- SELECT A DATE ----
// immediateCarousel = true means "the user just stopped here" (release drag,
// or a direct click) so the carousel should start rotating right away.
function selectDate(index, immediateCarousel) {
  currentDay = index;
  const day = diaryData[index];

  dateTitle.textContent = day.label;
  dayNumEl.textContent = day.dayNum;

  // Rich entries (bold/line breaks/code) use noteHTML; plain days use note.
  if (day.noteHTML) noteText.innerHTML = day.noteHTML;
  else noteText.textContent = day.note;

  moodTag.textContent = MOOD_LABEL[day.mood];
  renderLinks(day.links);

  if (day.showBigMochi) {
    // UI-polish week: show the big living Mochi instead of a photo/carousel.
    photoImg.style.display = 'none';
    bigMochi.style.display = 'block';
    carouselCtrl.style.display = 'none';
    photoCaption.textContent = day.bigCaption || 'Mochi, at full size';
    bigCtl.setMood(day.mood);
  } else {
    bigMochi.style.display = 'none';
    photoImg.style.display = 'block';

    // If a day has no real photos yet (research/GDD days), fall back to a
    // single "notes only" card instead of leaving the polaroid empty.
    const hasPhotos = day.photos && day.photos.length > 0;
    currentPhotos  = hasPhotos ? day.photos : [docPlaceholderSVG('Notes only — see links below')];
    currentCaptions = hasPhotos ? (day.photoCaptions || []) : ['Notes only — see links below'];
    currentPhoto = 0;
    showPhoto(0);
    carouselCtrl.style.display = currentPhotos.length > 1 ? 'flex' : 'none';
  }

  // Picking a date counts as activity: reset idle/blink state for the badge.
  badgeCtl.setMood(day.mood);

  if (immediateCarousel && !day.showBigMochi) startCarousel(); else stopCarousel();
}

// ---- SLIDER EVENTS ----
// 'input' fires continuously while dragging -> freeze the carousel so it
// doesn't spin while the user is still scrubbing through dates.
dateSlider.addEventListener('input', () => selectDate(Number(dateSlider.value), false));
// 'change' fires once, when the user lets go -> that's "stopping" on a date,
// so start the photo carousel rotating for that day.
dateSlider.addEventListener('change', () => selectDate(Number(dateSlider.value), true));

// ---- MANUAL PHOTO ARROWS ----
document.getElementById('prevPhoto').addEventListener('click', () => { showPhoto(currentPhoto - 1); startCarousel(); });
document.getElementById('nextPhoto').addEventListener('click', () => { showPhoto(currentPhoto + 1); startCarousel(); });

// ---- DARK MODE TOGGLE (same as login page) ----
const html = document.documentElement;
const sunIcon = document.getElementById('sunIcon');
const moonIcon = document.getElementById('moonIcon');
function applyTheme(dark) {
  html.setAttribute('data-theme', dark ? 'dark' : 'light');
  sunIcon.classList.toggle('active', !dark);
  moonIcon.classList.toggle('active', dark);
}
applyTheme(localStorage.getItem('theme') === 'dark');
document.getElementById('themeToggle').addEventListener('click', () => {
  const isDark = html.getAttribute('data-theme') === 'dark';
  applyTheme(!isDark);
  localStorage.setItem('theme', !isDark ? 'dark' : 'light');
});

// ---- START ----
selectDate(0, true); // land on June 1, carousel already rotating
</script>
